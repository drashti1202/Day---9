
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Employee Management System</h1>
        <p>Register and manage your employees</p>
    </header>

    <main class="container">

        <section class="form-section">
            <h2>Register Employee</h2>

            <form id="employeeForm">

                <label>Employee Name</label>
                <input type="text" id="name" placeholder="Enter employee name">

                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter email">

                <label>Department</label>
                <select id="department">
                    <option value="">Select Department</option>
                    <option value="IT">IT</option>
                    <option value="HR">HR</option>
                    <option value="Finance">Finance</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Sales">Sales</option>
                </select>

                <label>Salary</label>
                <input type="number" id="salary" placeholder="Enter salary">

                <p id="errorMessage"></p>

                <button type="submit">Register Employee</button>

            </form>
        </section>

        <section class="statistics">
            <div class="stat-card">
                <h3>Total Employees</h3>
                <p id="totalEmployees">0</p>
            </div>

            <div class="stat-card">
                <h3>Average Salary</h3>
                <p id="averageSalary">₹0</p>
            </div>

            <div class="stat-card">
                <h3>Highest Salary</h3>
                <p id="highestSalary">₹0</p>
            </div>
        </section>

        <section class="employee-section">
            <h2>Employee List</h2>
            <div id="employeeList" class="employee-list">
                <p>No employees registered yet.</p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
